<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S.</title>
    <style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 0;
        background-color: #020b14;
        /* Fondo con malla/cuadrícula cibernética y degradados futuristas */
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.15) 0%, transparent 60%),
            linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
        background-size: 100% 100%, 30px 30px, 30px 30px;
        color: #00d2ff;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
    }

    /* Esquinas decorativas estilo HUD Stark */
    body::before, body::after {
        content: "";
        position: absolute;
        width: 40px;
        height: 40px;
        border: 2px solid #00d2ff;
        pointer-events: none;
    }
    body::before {
        top: 20px;
        left: 20px;
        border-right: none;
        border-bottom: none;
    }
    body::after {
        bottom: 20px;
        right: 20px;
        border-left: none;
        border-top: none;
    }

    #canvas-container {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Anillo exterior decorativo con rotación continua */
    #canvas-container::before {
        content: "";
        position: absolute;
        width: 290px;
        height: 290px;
        border: 2px dashed rgba(0, 210, 255, 0.4);
        border-radius: 50%;
        animation: rotateHud 20s linear infinite;
    }

    @keyframes rotateHud {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    #status {
        margin-top: 30px;
        font-size: 14px;
        letter-spacing: 3px;
        text-align: center;
        max-width: 85%;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(0, 210, 255, 0.3);
        padding-bottom: 5px;
    }

    button {
        margin-top: 30px;
        background: rgba(0, 210, 255, 0.1);
        border: 2px solid #00d2ff;
        color: #00d2ff;
        padding: 14px 32px;
        border-radius: 4px;
        font-size: 14px;
        letter-spacing: 2px;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        font-weight: bold;
        text-transform: uppercase;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
    }

    button:active {
        background: #00d2ff;
        color: #020b14;
        box-shadow: 0 0 25px #00d2ff;
    }
</style>

</head>
<body>

    <div id="canvas-container">
        <canvas id="jarvisCore" width="280" height="280"></canvas>
    </div>
    <div id="status">SISTEMA OFFLINE</div>
    <button id="startBtn" onclick="initJarvis()">INICIAR JARVIS</button>

<script>
const API_KEY = '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'; // <--- PEGA TU CLAVE DE OPENAI AQUÍ

let canvas = document.getElementById('jarvisCore');
let ctx = canvas.getContext('2d');
let audioCtx, analyser, dataArray;

function drawCore(intensity = 0) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let centerX = canvas.width / 2;
    let centerY = canvas.height / 2;
    let radius = 55 + intensity * 0.4;

    let gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, radius + 35);
    gradient.addColorStop(0, '#00f0ff');
    gradient.addColorStop(0.6, '#0044ff');
    gradient.addColorStop(1, 'transparent');

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius + 35, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#00d2ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius + 10, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.fill();
}

drawCore();

async function initJarvis() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('status').innerText = "ESCUCHANDO...";

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);

        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        animate();
        startSpeechRecognition();
    } catch(err) {
        document.getElementById('status').innerText = "ERROR DE MICRÓFONO";
    }
}

function animate() {
    requestAnimationFrame(animate);
    if(analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = dataArray.reduce((a, b) => a + b, 0);
        let average = sum / dataArray.length;
        drawCore(average);
    }
}

function startSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        document.getElementById('status').innerText = "NAVEGADOR NO COMPATIBLE";
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'es-ES';
    recognition.continuous = false;

    recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('status').innerText = "PROCESANDO...";
        await queryJarvis(text);
    };

    recognition.onend = () => {
        // Reiniciar escucha tras finalizar
    };

    recognition.start();
}

async function queryJarvis(userText) {
    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [
                    { role: 'system', content: 'Eres JARVIS, la IA de Tony Stark. Responde de forma muy breve, educada, elegante y formal en español.' },
                    { role: 'user', content: userText }
                ]
            })
        });

        const data = await response.json();
        const reply = data.choices[0].message.content;
        speak(reply);
    } catch (e) {
        document.getElementById('status').innerText = "ERROR AL CONECTAR CON JARVIS";
    }
}

function speak(text) {
    document.getElementById('status').innerText = "RESPONDIENDO...";
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'es-ES';
    utterance.pitch = 0.85;
    utterance.rate = 1.0;

    utterance.onend = () => {
        document.getElementById('status').innerText = "ESCUCHANDO...";
        startSpeechRecognition();
    };

    window.speechSynthesis.speak(utterance);
}
</script>
</body>
</html>
