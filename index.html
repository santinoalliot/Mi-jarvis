<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. HUD</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #030810;
            /* Fondo con malla cybertécnica y resplandor radial */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.12) 0%, transparent 70%),
                linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: #00d2ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 6px rgba(0, 210, 255, 0.7);
        }

        /* Marcos y marcas de esquinas HUD */
        .hud-corner {
            position: absolute;
            font-size: 10px;
            letter-spacing: 1px;
            color: rgba(0, 210, 255, 0.6);
            padding: 10px;
        }
        .top-left { top: 15px; left: 15px; border-left: 2px solid #00d2ff; border-top: 2px solid #00d2ff; }
        .top-right { top: 15px; right: 15px; border-right: 2px solid #00d2ff; border-top: 2px solid #00d2ff; text-align: right; }
        .bottom-left { bottom: 15px; left: 15px; border-left: 2px solid #00d2ff; border-bottom: 2px solid #00d2ff; }
        .bottom-right { bottom: 15px; right: 15px; border-right: 2px solid #00d2ff; border-bottom: 2px solid #00d2ff; text-align: right; }

        /* Contenedor central del núcleo con anillos giratorios */
        #hud-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Anillo exterior segmentado en rotación horaria */
        .ring-outer {
            position: absolute;
            width: 310px;
            height: 310px;
            border: 2px dashed rgba(0, 210, 255, 0.5);
            border-radius: 50%;
            animation: rotateClockwise 25s linear infinite;
        }

        /* Anillo secundario con ticks en rotación antihoraria */
        .ring-middle {
            position: absolute;
            width: 270px;
            height: 270px;
            border: 3px dotted rgba(0, 240, 255, 0.7);
            border-radius: 50%;
            animation: rotateCounter 15s linear infinite;
        }

        @keyframes rotateClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        canvas {
            position: relative;
            z-index: 2;
            border-radius: 50%;
        }

        /* Muestra de estado de Jarvis */
        #status {
            margin-top: 25px;
            font-size: 13px;
            letter-spacing: 3px;
            text-align: center;
            max-width: 85%;
            text-transform: uppercase;
            background: rgba(0, 210, 255, 0.05);
            border-left: 3px solid #00d2ff;
            border-right: 3px solid #00d2ff;
            padding: 6px 16px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        /* Botón futurista */
        button {
            margin-top: 25px;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 12px 28px;
            border-radius: 2px;
            font-size: 13px;
            letter-spacing: 2px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        button:active {
            background: #00d2ff;
            color: #030810;
            box-shadow: 0 0 20px #00d2ff;
        }
    </style>
</head>
<body>

    <div class="hud-corner top-left">
        SYS.VER // 4.0.8<br>
        CORE: ACTIVE
    </div>
    <div class="hud-corner top-right">
        LOC: SANTA FE<br>
        NET: SECURE
    </div>
    <div class="hud-corner bottom-left">
        AUDIO: STT/TTS<br>
        MODE: INTERACTIVE
    </div>
    <div class="hud-corner bottom-right">
        J.A.R.V.I.S.<br>
        STARK IND.
    </div>

    <div id="hud-container">
        <div class="ring-outer"></div>
        <div class="ring-middle"></div>
        <canvas id="jarvisCore" width="240" height="240"></canvas>
    </div>

    <div id="status">SISTEMA ONLINE // EN ESPERA</div>
    <button id="startBtn" onclick="initJarvis()">INICIAR JARVIS</button>

<script>
const API_KEY = 'AQ.Ab8RN6KIOtcO8EFXQQI-54jMjbNBVZRZsYAJvKaUJYEFMmnoKw'; // <--- PEGA TU CLAVE DE OPENAI AQUÍ

let canvas = document.getElementById('jarvisCore');
let ctx = canvas.getContext('2d');
let audioCtx, analyser, dataArray;

// Dibujar el núcleo dinámico con gradientes y ticks
function drawCore(intensity = 0) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let centerX = canvas.width / 2;
    let centerY = canvas.height / 2;
    let radius = 45 + intensity * 0.45;

    // Resplandor del núcleo
    let gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, radius + 30);
    gradient.addColorStop(0, '#00ffff');
    gradient.addColorStop(0.4, '#0088ff');
    gradient.addColorStop(0.8, '#002266');
    gradient.addColorStop(1, 'transparent');

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius + 30, 0, Math.PI * 2);
    ctx.fill();

    // Marcadores radiales interiores (Ticks tipo HUD)
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
        let angle = (i * Math.PI) / 6;
        let x1 = centerX + Math.cos(angle) * (radius + 5);
        let y1 = centerY + Math.sin(angle) * (radius + 5);
        let x2 = centerX + Math.cos(angle) * (radius + 12);
        let y2 = centerY + Math.sin(angle) * (radius + 12);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    // Anillo interno brillante
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Centro sólido reactivo
    ctx.fillStyle = '#00d2ff';
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius * 0.6, 0, Math.PI * 2);
    ctx.fill();
}

drawCore();

async function initJarvis() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('status').innerText = "ESCUCHANDO...";

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);

        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        animate();
        startSpeechRecognition();
    } catch(err) {
        document.getElementById('status').innerText = "ERROR DE MICRÓFONO";
    }
}

function animate() {
    requestAnimationFrame(animate);
    if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = dataArray.reduce((a, b) => a + b, 0);
        let average = sum / dataArray.length;
        drawCore(average);
    }
}

function startSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        document.getElementById('status').innerText = "NAVEGADOR NO COMPATIBLE";
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'es-ES';
    recognition.continuous = false;

    recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('status').innerText = "PROCESANDO...";
        await queryJarvis(text);
    };

    recognition.onerror = () => {
        document.getElementById('status').innerText = "ESCUCHANDO...";
        startSpeechRecognition();
    };

    recognition.start();
}

async function queryJarvis(userText) {
    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [
                    { role: 'system', content: 'Eres JARVIS, la IA de Iron Man. Responde de forma breve, educada, formal y muy elegante en español.' },
                    { role: 'user', content: userText }
                ]
            })
        });

        const data = await response.json();
        const reply = data.choices[0].message.content;
        speak(reply);
    } catch (e) {
        document.getElementById('status').innerText = "ERROR DE CONEXIÓN";
    }
}

function speak(text) {
    document.getElementById('status').innerText = "RESPONDIONDO...";
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'es-ES';
    utterance.pitch = 0.85;
    utterance.rate = 1.0;

    utterance.onend = () => {
        document.getElementById('status').innerText = "ESCUCHANDO...";
        startSpeechRecognition();
    };

    window.speechSynthesis.speak(utterance);
}
</script>
</body>
</html>
